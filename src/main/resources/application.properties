spring.application.name=finance-bff-atm
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
server.port=8083
server.ssl.key-store=classpath:finance-keystore.p12
server.ssl.key-store-password=fec4a5n5
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=finance-local
server.ssl.enabled=true
# Configuración OAuth2 con GitHub
server.forward-headers-strategy=framework
spring.security.oauth2.client.registration.github-atm.provider=github
spring.security.oauth2.client.registration.github-atm.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github-atm.client-secret=${GITHUB_CLIENT_SECRET}
# --- CONFIGURACIÓN DE RESILIENCE4J ---
# El nombre de nuestro cortacircuitos será "financeCore"

# Evalúa los últimos 5 intentos
resilience4j.circuitbreaker.instances.financeCore.sliding-window-size=5

# Si el 50% de esos intentos fallan, el circuito se ABRE
resilience4j.circuitbreaker.instances.financeCore.failure-rate-threshold=50

# Tiempo que espera abierto antes de intentar probar si el Core revivió (Half-Open)
resilience4j.circuitbreaker.instances.financeCore.wait-duration-in-open-state=10s

# Cuántas peticiones deja pasar para probar si el sistema se recuperó
resilience4j.circuitbreaker.instances.financeCore.permitted-number-of-calls-in-half-open-state=3